[project]
name = "pmo-portfolio-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-storage-file-datalake>=12.26.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the live lakehouse and Foundry; runs only when PMO_RUN_INTEGRATION=1",
]
