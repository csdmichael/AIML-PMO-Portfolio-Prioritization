name: Infra (Bicep)

on:
  push:
    branches: [main]
    paths:
      - "infra/bicep/**"
      - "infra/config/**"
      - "infra/scripts/**"
      - "docs/api/openapi.json"
      - ".github/workflows/infra-bicep.yml"
  pull_request:
    paths:
      - "infra/bicep/**"
      - "infra/config/**"
      - "infra/scripts/**"
      - "docs/api/openapi.json"
      - ".github/workflows/infra-bicep.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Bicep template to the resource group
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-bicep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Azure settings
        id: azure
        run: node scripts/ci/read-config.mjs --file infra/config/pmo-deployment.json --key tenantId=tenantId --key subscriptionId=subscriptionId

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.azure.outputs.tenantId }}
          subscription-id: ${{ steps.azure.outputs.subscriptionId }}

      - name: Build, lint, and validate the template
        shell: pwsh
        run: ./infra/scripts/deploy.ps1 -IacTool bicep -Mode validate

      - name: Preview the changes on pull requests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./infra/scripts/deploy.ps1 -IacTool bicep -Mode plan

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Azure settings
        id: azure
        run: node scripts/ci/read-config.mjs --file infra/config/pmo-deployment.json --key tenantId=tenantId --key subscriptionId=subscriptionId

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.azure.outputs.tenantId }}
          subscription-id: ${{ steps.azure.outputs.subscriptionId }}

      - name: Deploy the Bicep infrastructure
        shell: pwsh
        run: ./infra/scripts/deploy.ps1 -IacTool bicep -Mode infra
