name: UI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
      - "infra/scripts/deploy.ps1"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read CI settings
        id: ci
        run: node scripts/ci/read-config.mjs --file config/ci.json --key nodeVersion=node.version --key pythonVersion=python.version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.nodeVersion }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the Ionic UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Test the Ionic UI
        working-directory: ui
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci.outputs.pythonVersion }}

      - uses: astral-sh/setup-uv@v6

      - name: Test the UI host
        working-directory: ui/server
        run: |
          uv sync --frozen
          uv run pytest

      - uses: actions/upload-artifact@v4
        with:
          name: ui-www
          path: ui/www

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read CI and Azure settings
        id: ci
        run: |
          node scripts/ci/read-config.mjs --file config/ci.json --key pythonVersion=python.version
          node scripts/ci/read-config.mjs --file infra/config/pmo-deployment.json --key tenantId=tenantId --key subscriptionId=subscriptionId

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.ci.outputs.tenantId }}
          subscription-id: ${{ steps.ci.outputs.subscriptionId }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci.outputs.pythonVersion }}

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the UI to App Service
        shell: pwsh
        run: ./infra/scripts/deploy.ps1 -Mode publish -Component ui -Python python -Uv uv
