name: Data

on:
  push:
    branches: [main]
    paths:
      - "data-generator/**"
      - "config/data-generation.json"
      - "config/portfolios.json"
      - "config/data-sources.json"
      - ".github/workflows/data.yml"
  pull_request:
    paths:
      - "data-generator/**"
      - "config/data-generation.json"
      - "config/portfolios.json"
      - "config/data-sources.json"
      - ".github/workflows/data.yml"
  workflow_dispatch:
    inputs:
      uploadToOneLake:
        description: Upload the generated sources to the OneLake lakehouse
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read CI settings
        id: ci
        run: node scripts/ci/read-config.mjs --file config/ci.json --key pythonVersion=python.version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci.outputs.pythonVersion }}

      - uses: astral-sh/setup-uv@v6

      - name: Generate the source data
        working-directory: data-generator
        run: |
          uv sync --frozen
          uv run python generate_pmo_data.py

      - name: Fail when the generated data differs from the committed data
        run: git diff --exit-code -- data

  upload:
    needs: generate
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.uploadToOneLake)
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read CI and Azure settings
        id: ci
        run: |
          node scripts/ci/read-config.mjs --file config/ci.json --key pythonVersion=python.version
          node scripts/ci/read-config.mjs --file infra/config/pmo-deployment.json --key tenantId=tenantId --key subscriptionId=subscriptionId

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.ci.outputs.tenantId }}
          subscription-id: ${{ steps.ci.outputs.subscriptionId }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci.outputs.pythonVersion }}

      - uses: astral-sh/setup-uv@v6

      - name: Upload the sources to OneLake
        working-directory: data-generator
        run: |
          uv sync --frozen
          uv run python upload_to_onelake.py
